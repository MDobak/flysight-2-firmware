# Builds the website image (web/Dockerfile) and pushes it to the GitHub
# container registry. The secret ANDROID_DEBUG_KEYSTORE (base64) is the key
# that signs the Android app in the image. Images:
#   ghcr.io/<owner>/flysight-2-firmware-web:develop      (branch mdobak/develop)
#   ghcr.io/<owner>/flysight-2-firmware-web:simulation   (branch mdobak/simulation)
# Each push also gets a tag with the short commit hash, for example develop-3e64227.
name: Website image

on:
  push:
    branches: [mdobak/develop, mdobak/simulation]
    paths-ignore: ['Docs/**', 'Tests/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags and the history

      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache: false # no go.sum: the website uses only the standard library

      - name: Test the website
        working-directory: web
        run: |
          go vet ./...
          go test ./...

      - name: Get the image names
        id: names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flysight-2-firmware-web"
          tag="${GITHUB_REF_NAME##*/}"
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "tags=$image:$tag,$image:$tag-${GITHUB_SHA::7}"
            echo "version=$(git describe --tags --always)"
          } >> "$GITHUB_OUTPUT"

      - name: Get the Android signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Set the secret ANDROID_DEBUG_KEYSTORE (base64 of the debug keystore)."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: VERSION=${{ steps.names.outputs.version }}
          secret-files: android_keystore=${{ runner.temp }}/debug.keystore
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.description=FlySight 2 fork: APP.SFB from FLYSIGHT.TXT, the new sound files, and the Android app
          cache-from: type=gha,scope=web-${{ steps.names.outputs.tag }}
          cache-to: type=gha,mode=max,scope=web-${{ steps.names.outputs.tag }}
